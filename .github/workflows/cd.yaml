name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v5
    secrets:
      halo-pat: ${{ secrets.HALO_RUN_PAT }}
    permissions:
      contents: write
    with:
      ui-path: "ui"
      app-id: app-klfhbdga
      sync-github-readme: true

apiVersion: v1alpha1
kind: Role
metadata:
  name: simnook-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "SIMnook"
    rbac.authorization.halo.run/display-name: "号卡管理"
    rbac.authorization.halo.run/ui-permissions: '["plugin:simnook:manage"]'
    rbac.authorization.halo.run/dependencies: '["role-template-view-attachments"]'
rules:
  - apiGroups: ["simnook.halo.run"]
    resources: ["simcards"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["console.api.simnook.halo.run"]
    resources: ["cardviews"]
    verbs: ["get", "list"]
  - apiGroups: ["console.api.simnook.halo.run"]
    resources: ["cardviews/renewal"]
    verbs: ["create"]
  - apiGroups: ["console.api.simnook.halo.run"]
    resources: ["reminders"]
    verbs: ["get", "update"]
  - apiGroups: ["console.api.simnook.halo.run"]
    resources: ["backups"]
    verbs: ["get"]
  # Halo 将 POST /resource/name 识别为非资源请求，需为这两个动作单独授权。
  - nonResourceURLs:
      - "/apis/console.api.simnook.halo.run/v1alpha1/backups/preview"
      - "/apis/console.api.simnook.halo.run/v1alpha1/backups/restore"
    verbs: ["create"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: simnook-public
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
    rbac.authorization.halo.run/aggregate-to-authenticated: "true"
rules:
  - apiGroups: ["api.simnook.halo.run"]
    resources: ["cards", "site"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/simnook", "/simnook/**"]
    verbs: ["get"]
